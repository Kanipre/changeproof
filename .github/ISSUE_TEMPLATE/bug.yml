name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets or undisclosed security issues.

  - type: input
    id: version
    attributes:
      label: ChangeProof version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: Node 22.17.0 on Windows 11
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: Remove private repository names and paths.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Changed paths
      description: The smallest path list that reproduces the behavior.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not an undisclosed security vulnerability.
          required: true
