name: Change evidence

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  changeproof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require change evidence
        uses: Kanipre/changeproof@v0.1.1
