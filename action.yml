name: ChangeProof
description: Enforce declarative evidence requirements for pull requests.
author: ChangeProof contributors

inputs:
  config:
    description: Repository-relative configuration path; read from the event base commit for pull requests and merge groups.
    required: false
    default: .changeproof.yml
  base:
    description: Base Git revision. Detected from the GitHub event when omitted.
    required: false
  head:
    description: Head Git revision. Detected from the GitHub event when omitted.
    required: false

outputs:
  passed:
    description: Whether all error-severity policies passed.
  errors:
    description: Number of failed error-severity policies.
  warnings:
    description: Number of failed warning-severity policies.
  changed-files:
    description: Number of changed files evaluated.

runs:
  using: node24
  main: action-dist/index.cjs

branding:
  icon: shield
  color: green
